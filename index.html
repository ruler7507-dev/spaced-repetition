<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Spaced Repetition Notebook</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #f8fafc; --sub: #94a3b8; --primary: #4f46e5;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
    header h1 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .badge { background: #4f46e533; color: #818cf8; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 700; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .stat-val { font-size: 24px; font-weight: 900; }
    .stat-lbl { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .task-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .task-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .task-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .task-notes { font-size: 13px; color: var(--sub); white-space: pre-wrap; margin-bottom: 10px; }
    .task-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sub); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: var(--card); border: 1px solid var(--border); width: 100%; max-width: 480px; border-radius: 18px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    input, textarea { width: 100%; background: #0b1120; border: 1px solid var(--border); border-radius: 10px; color: #fff; padding: 10px 12px; margin-top: 6px; margin-bottom: 14px; font-size: 14px; }
    .flashcard { min-height: 200px; background: #0b1120; border: 2px dashed var(--border); border-radius: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; margin: 16px 0; cursor: pointer; }
    .rating-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    #lockScreen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .pin-box { display: flex; gap: 10px; margin: 20px 0; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--primary); }
    .pin-dot.filled { background: var(--primary); }
    .keypad { display: grid; grid-template-columns: repeat(3, 70px); gap: 12px; }
    .keypad button { height: 70px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- PIN LOCK SCREEN -->
  <div id="lockScreen">
    <h2>🔒 App Locked</h2>
    <p style="color: var(--sub); font-size: 13px; margin-top: 4px;">Enter your 4-digit PIN</p>
    <div class="pin-box">
      <div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div><div class="pin-dot" id="d4"></div>
    </div>
    <div class="keypad" id="keypad"></div>
  </div>

  <!-- MAIN HEADER -->
  <header>
    <h1>🧠 Spaced Repetition <span class="badge" id="dueCountBadge">0 Due</span></h1>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline" onclick="openStudyModal()">📖 Study</button>
      <button class="btn" onclick="openTaskModal()">+ New</button>
    </div>
  </header>

  <!-- DASHBOARD -->
  <div class="container">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-val" style="color: var(--warning);" id="statDue">0</div>
        <div class="stat-lbl">Due Today for Review</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color: var(--success);" id="statMastered">0</div>
        <div class="stat-lbl">Mastered (30d Completed)</div>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 style="font-size: 15px;">Your Tasks & Notes</h2>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-outline" style="padding:5px 10px; font-size:11px;" onclick="exportJSON()">📥 Export</button>
        <button class="btn btn-outline" style="padding:5px 10px; font-size:11px;" onclick="document.getElementById('importFile').click()">📤 Import</button>
        <input type="file" id="importFile" style="display:none" onchange="importJSON(event)" />
        <button class="btn btn-outline" style="padding:5px 10px; font-size:11px;" onclick="setPinPrompt()">🔑 Set PIN</button>
      </div>
    </div>

    <div id="taskList"></div>
  </div>

  <!-- NEW TASK MODAL -->
  <div class="modal" id="taskModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">Create Study Item</h3>
      <label style="font-size:12px; color:var(--sub);">Question / Task Title</label>
      <input type="text" id="taskTitle" placeholder="e.g., Photosynthesis light reactions" />
      <label style="font-size:12px; color:var(--sub);">Answer / Study Notes (Markdown / Text)</label>
      <textarea id="taskNotes" rows="4" placeholder="e.g., Takes place in thylakoid membranes..."></textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-outline" onclick="closeModal('taskModal')">Cancel</button>
        <button class="btn" onclick="saveNewTask()">Save Item</button>
      </div>
    </div>
  </div>

  <!-- STUDY FLASHCARD MODAL -->
  <div class="modal" id="studyModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Flashcard Study Session</h3>
        <span id="studyCounter" class="badge">1 of 1</span>
      </div>
      <div class="flashcard" id="cardBox" onclick="flipCard()">
        <p style="font-size:12px; color:var(--sub); margin-bottom:8px;" id="cardSub">QUESTION (Tap to reveal)</p>
        <h4 style="font-size:17px; font-weight:800;" id="cardMain">...</h4>
      </div>
      <div class="rating-row" id="rateButtons" style="display:none;">
        <button class="btn btn-danger" onclick="rateCard('hard')">Hard (Repeat)</button>
        <button class="btn" onclick="rateCard('good')">Good (+Interval)</button>
        <button class="btn btn-success" onclick="rateCard('easy')">Easy (Skip Ahead)</button>
      </div>
      <button class="btn btn-outline" style="width:100%; margin-top:10px;" onclick="closeModal('studyModal')">Close</button>
    </div>
  </div>

  <script>
    // 5-STAGE EBBINGHAUS INTERVALS: 0: Today, 1: +1d, 2: +3d, 3: +7d, 4: +30d (Mastered)
    const INTERVALS = [0, 1, 3, 7, 30];
    let tasks = JSON.parse(localStorage.getItem('sr_tasks') || '[]');
    let currentPin = localStorage.getItem('sr_pin') || '';
    let enteredPin = '';
    let studyQueue = [];
    let studyIndex = 0;
    let isFlipped = false;

    // PIN LOCK LOGIC
    function checkPin() {
      if (currentPin) {
        document.getElementById('lockScreen').style.display = 'flex';
        renderKeypad();
      }
    }
    function renderKeypad() {
      const pad = document.getElementById('keypad');
      pad.innerHTML = '';
      [1,2,3,4,5,6,7,8,9,'C',0,'⌫'].forEach(k => {
        const btn = document.createElement('button');
        btn.textContent = k;
        btn.onclick = () => handleKey(k);
        pad.appendChild(btn);
      });
    }
    function handleKey(k) {
      if (k === 'C') enteredPin = '';
      else if (k === '⌫') enteredPin = enteredPin.slice(0, -1);
      else if (typeof k === 'number' && enteredPin.length < 4) enteredPin += k;
      for (let i = 1; i <= 4; i++) {
        document.getElementById('d' + i).className = 'pin-dot' + (i <= enteredPin.length ? ' filled' : '');
      }
      if (enteredPin.length === 4) {
        if (enteredPin === currentPin) {
          document.getElementById('lockScreen').style.display = 'none';
          enteredPin = '';
        } else {
          alert('Incorrect PIN!');
          enteredPin = '';
          for (let i = 1; i <= 4; i++) document.getElementById('d' + i).className = 'pin-dot';
        }
      }
    }
    function setPinPrompt() {
      const p = prompt('Set 4-digit PIN (leave blank to remove lock):');
      if (p !== null) {
        currentPin = p;
        localStorage.setItem('sr_pin', p);
        alert(p ? 'PIN Set!' : 'PIN Removed!');
      }
    }

    // TASK MANAGEMENT & REPETITION SCHEDULER
    function saveTasks() { localStorage.setItem('sr_tasks', JSON.stringify(tasks)); render(); }
    function isDue(dateStr) {
      const now = new Date(); now.setHours(23,59,59,999);
      return new Date(dateStr) <= now;
    }
    function saveNewTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const notes = document.getElementById('taskNotes').value.trim();
      if (!title) return alert('Enter a title');
      const now = new Date();
      tasks.unshift({
        id: Date.now().toString(),
        title, notes,
        stage: 0,
        dueDate: now.toISOString(),
        isMastered: false
      });
      saveTasks();
      closeModal('taskModal');
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskNotes').value = '';
    }

    function render() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      let dueCount = 0;
      let masteredCount = 0;

      tasks.forEach(t => {
        const due = isDue(t.dueDate);
        if (due && !t.isMastered) dueCount++;
        if (t.isMastered) masteredCount++;

        const div = document.createElement('div');
        div.className = 'task-card';
        div.innerHTML = `
          <div class="task-header">
            <div class="task-title">${t.title}</div>
            <span class="badge" style="background:${t.isMastered ? '#10b98133' : due ? '#f59e0b33' : '#4f46e533'}; color:${t.isMastered ? '#34d399' : due ? '#fbbf24' : '#818cf8'}">
              ${t.isMastered ? 'Mastered' : due ? 'Due Now' : 'Stage ' + t.stage + ' (' + INTERVALS[t.stage] + 'd)'}
            </span>
          </div>
          ${t.notes ? `<div class="task-notes">${t.notes}</div>` : ''}
          <div class="task-meta">
            <span>Next: ${new Date(t.dueDate).toLocaleDateString()}</span>
            <button class="btn btn-outline" style="padding:4px 8px; font-size:11px; color:#ef4444;" onclick="deleteTask('${t.id}')">Delete</button>
          </div>
        `;
        list.appendChild(div);
      });

      document.getElementById('statDue').textContent = dueCount;
      document.getElementById('statMastered').textContent = masteredCount;
      document.getElementById('dueCountBadge').textContent = dueCount + ' Due';
    }

    function deleteTask(id) {
      if (confirm('Delete this card?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
      }
    }

    // FLASHCARD STUDY SESSION
    function openStudyModal() {
      studyQueue = tasks.filter(t => isDue(t.dueDate) && !t.isMastered);
      if (!studyQueue.length) return alert('No tasks due for review today! Excellent job 🎉');
      studyIndex = 0;
      document.getElementById('studyModal').style.display = 'flex';
      loadCard();
    }
    function loadCard() {
      isFlipped = false;
      const t = studyQueue[studyIndex];
      document.getElementById('studyCounter').textContent = `${studyIndex + 1} of ${studyQueue.length}`;
      document.getElementById('cardSub').textContent = 'QUESTION (Tap card to flip)';
      document.getElementById('cardMain').textContent = t.title;
      document.getElementById('rateButtons').style.display = 'none';
    }
    function flipCard() {
      if (isFlipped) return;
      isFlipped = true;
      const t = studyQueue[studyIndex];
      document.getElementById('cardSub').textContent = 'ANSWER / NOTES';
      document.getElementById('cardMain').textContent = t.notes || '(No notes provided)';
      document.getElementById('rateButtons').style.display = 'grid';
    }
    function rateCard(rating) {
      const t = studyQueue[studyIndex];
      const now = new Date();
      if (rating === 'hard') {
        t.dueDate = now.toISOString(); // Keep due today
      } else if (rating === 'good') {
        t.stage = Math.min(4, t.stage + 1);
        if (t.stage === 4) t.isMastered = true;
        now.setDate(now.getDate() + INTERVALS[t.stage]);
        t.dueDate = now.toISOString();
      } else if (rating === 'easy') {
        t.stage = Math.min(4, t.stage + 2);
        if (t.stage === 4) t.isMastered = true;
        now.setDate(now.getDate() + INTERVALS[t.stage]);
        t.dueDate = now.toISOString();
      }
      saveTasks();

      studyIndex++;
      if (studyIndex < studyQueue.length) {
        loadCard();
      } else {
        alert('🎉 Study session completed!');
        closeModal('studyModal');
      }
    }

    // BACKUP IMPORT / EXPORT
    function exportJSON() {
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `spaced-repetition-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }
    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          tasks = JSON.parse(evt.target.result);
          saveTasks();
          alert('Imported successfully!');
        } catch { alert('Invalid JSON file'); }
      };
      reader.readAsText(file);
    }

    function openTaskModal() { document.getElementById('taskModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // SERVICE WORKER REGISTRATION
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    checkPin();
    render();
  </script>
</body>
</html>
